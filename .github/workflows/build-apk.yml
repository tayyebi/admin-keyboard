name: Build APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_artifacts:
        description: "Upload build artifacts"
        required: false
        default: "true"
        type: boolean

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_artifacts == 'true')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Derive version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME=$(grep 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          fi
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION_NAME} (${VERSION_CODE})"

      - name: Patch version in build.gradle
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.version_code }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.version_name }}\"/" app/build.gradle

      - name: Set up release signing
        env:
          STORE_FILE_B64: ${{ secrets.STORE_FILE_B64 }}
        run: |
          if [ -n "$STORE_FILE_B64" ]; then
            echo "$STORE_FILE_B64" | base64 -d > release.keystore
            STORE_PASS="${{ secrets.STORE_PASSWORD }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            echo "Signing with provided keystore"
          else
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias release \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=TKLKeyboard, OU=Dev, O=TLKKeyboard, L=City, ST=State, C=US"
            STORE_PASS="android"
            KEY_PASS="android"
            KEY_ALIAS="release"
            echo "::warning::No signing secrets found; building with a throwaway key"
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../release.keystore\n' \
            "$STORE_PASS" "$KEY_PASS" "$KEY_ALIAS" > key.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_PATH" "tlk-keyboard-${{ steps.version.outputs.version_name }}.apk"

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: tlk-keyboard-${{ steps.version.outputs.version_name }}
          path: tlk-keyboard-${{ steps.version.outputs.version_name }}.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tlk-keyboard-${{ steps.version.outputs.version_name }}.apk
          generate_release_notes: true
